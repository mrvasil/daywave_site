<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020405" />
    <meta
      name="description"
      content="Daywave CTF team. Attack–Defense game statistics, team updates on Telegram, and results on CTFtime."
    />
    <title>Daywave Team</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="page__spotlight" aria-hidden="true"></div>
      <div class="page__grid" aria-hidden="true"></div>
      <div class="page__glow page__glow--north" aria-hidden="true"></div>
      <div class="page__glow page__glow--south" aria-hidden="true"></div>

      <header class="meta">
        <p class="meta__item">DAYWAVE</p>
      </header>

      <main class="hero">
        <h1 class="sr-only">Daywave team</h1>
        <div class="hero__logo-shell" data-tilt-card>
          <div class="hero__hover-light" aria-hidden="true"></div>
          <img class="hero__logo" src="logo.svg" alt="Daywave logo" />
        </div>
        <p class="hero__note">ctf / team</p>
        <nav class="team-links" aria-label="Follow Daywave">
          <a class="team-link" href="https://stats.daywave.ru" target="_blank" rel="noopener noreferrer" aria-label="Attack–Defense game statistics (opens in a new tab)" title="Attack–Defense game statistics">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 19V13M12 19V5M19 19V9" />
            </svg>
            <span>A/D stats</span>
          </a>
          <a class="team-link" href="https://t.me/daywave_team" target="_blank" rel="noopener noreferrer" aria-label="Daywave Telegram channel (opens in a new tab)" title="Telegram · @daywave_team">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m21 3-4 18-6-5-4 3v-6L3 11 21 3Z" />
              <path d="m7 13 9-6-5 9" />
            </svg>
            <span>Telegram</span>
          </a>
          <a class="team-link" href="https://ctftime.org/team/389611" target="_blank" rel="noopener noreferrer" aria-label="Daywave on CTFtime (opens in a new tab)" title="CTFtime · team profile and results">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3h8v5a4 4 0 0 1-8 0V3ZM8 5H4v2a4 4 0 0 0 4 4M16 5h4v2a4 4 0 0 1-4 4M12 12v6M8 21h8M10 18h4l2 3H8l2-3Z" />
            </svg>
            <span>CTFtime</span>
          </a>
        </nav>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
