<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020405" />
    <meta
      name="description"
      content="Minimal team landing page built around the Daywave logo."
    />
    <title>Daywave Team</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="page__spotlight" aria-hidden="true"></div>
      <div class="page__grid" aria-hidden="true"></div>
      <div class="page__glow page__glow--north" aria-hidden="true"></div>
      <div class="page__glow page__glow--south" aria-hidden="true"></div>

      <header class="meta">
        <p class="meta__item">DAYWAVE</p>
      </header>

      <main class="hero">
        <h1 class="sr-only">Daywave team</h1>
        <div class="hero__logo-shell" data-tilt-card>
          <div class="hero__hover-light" aria-hidden="true"></div>
          <img class="hero__logo" src="logo.svg" alt="Daywave logo" />
        </div>
        <p class="hero__note">ctf / team</p>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
